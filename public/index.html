<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Set the character encoding for the document -->
    <meta charset="utf-8" />
    
    <!-- Define the viewport settings for mobile devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5" />
    
    <!-- Define the theme color for the website -->
    <meta name="theme-color" content="#FCA61F" />
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="Ashish Alok - Professional Web Developer Portfolio. B.Tech from NIT Patna. Expert in React, Node.js, and full-stack development. View my projects and get in touch." />
    <meta name="keywords" content="Ashish Alok, Web Developer, React Developer, Full Stack Developer, NIT Patna, Portfolio, Frontend Developer, Backend Developer" />
    <meta name="author" content="Ashish Alok" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Ashish Alok - Web Developer Portfolio" />
    <meta property="og:description" content="Professional Web Developer with expertise in React, Node.js, and full-stack development. B.Tech from NIT Patna." />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ashish Alok - Web Developer Portfolio" />
    <meta name="twitter:description" content="Professional Web Developer with expertise in React, Node.js, and full-stack development." />
    
    <!-- Favicon -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    
    <!-- Preconnect to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Set the title of the webpage -->
    <title>Ashish Alok | Web Developer Portfolio</title>
  </head>

  <body>
    <!-- Display a message for users who have disabled JavaScript -->
    <noscript>You need to enable JavaScript to run this app.</noscript>
    
    <!-- The root div where the React application will be mounted -->
    <div id="root"></div>
  </body>
</html>
